name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

resources:
  repositories:
    # publish-helm-chart.yml template — pushes the packaged chart to
    # gh-pages (channel=dev) on every main build and to
    # meshmakers.github.io/charts/ (channel=release) on every r* tag.
    # Replaces the old Classic Release pipeline whose inline `git push`
    # ran in detached-HEAD and silently dropped octo-mesh-3.3.99/100.
    - repository: helmChartBuild
      type: github
      name: meshmakers/helm-chart-build
      endpoint: meshmakers-access-token
      ref: refs/heads/main

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main

variables:
  - group: GitSSHGroup
  - group: OctoDefault
  # Carries HelmChartBuildGhToken — the PAT publish-helm-chart.yml uses
  # to push the chart to gh-pages / meshmakers.github.io. Same group the
  # adapter pipelines link.
  - group: ApiKeys-mm-cloud
  - name: MajorVersion
    value: 0
  - name: MinorVersion
    value: 1
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  # Long-lived branch lines (test/0.2-dev). Matches the naming other repos use.
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: helm build
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: update-build-number.yml
          # Sets $(ChartVersion) — 3-segment SemVer derived from
          # Build.BuildNumber. See helm-chart-build's docs/PUBLISHING.md.
          - template: ci-templates/derive-chart-version.yml@helmChartBuild
          - checkout: self
            clean: true
            submodules: recursive
          - task: InstallSSHKey@0
            inputs:
              knownHostsEntry: '$(SSHKnownHosts)'
              sshPublicKey: '$(SSHPublicKey)'
              sshPassphrase: '$(SSHPassphrase)'
              sshKeySecureFile: '$(SSHPrivateKeyFile)'

          # ---- octo-mesh ----
          - task: HelmDeploy@0
            displayName: 'helm package octo-mesh'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/octo-mesh'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber)'
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-mesh
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: platform
              chartName: octo-mesh
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))

          # ---- octo-mesh-demo-app ----
          - task: HelmDeploy@0
            displayName: 'helm package octo-mesh-demo-app'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/octo-mesh-demo-app'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber)'
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-mesh-demo-app
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-demo-app-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: platform
              chartName: octo-mesh-demo-app
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-demo-app-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))

          # ---- octo-mesh-crds ----
          - task: HelmDeploy@0
            displayName: 'helm package octo-mesh-crds'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/octo-mesh-crds'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber)'
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-mesh-crds
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-crds-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: platform
              chartName: octo-mesh-crds
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-crds-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))

          # ---- octo-mesh-communication-operator ----
          - task: HelmDeploy@0
            displayName: 'helm package octo-mesh-communication-operator'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/octo-mesh-communication-operator'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber) --dependency-update'
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-mesh-communication-operator
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-communication-operator-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: platform
              chartName: octo-mesh-communication-operator
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-communication-operator-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))

          # ---- octo-mesh-schema-provider ----
          - task: HelmDeploy@0
            displayName: 'helm package octo-mesh-schema-provider'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/octo-mesh-schema-provider'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber) --dependency-update'
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-mesh-schema-provider
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-schema-provider-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: platform
              chartName: octo-mesh-schema-provider
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-mesh-schema-provider-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))

          # Pipeline artifact retained for deploy-octo-mesh-core-services* —
          # they read versioninfo.txt from this `local` artifact. Restricted to
          # the builds those deploy pipelines may consume (main / 0.2-* / r-tags):
          # ADO resolves a non-triggering pipeline resource to the LATEST build
          # with artifacts regardless of branch, so a PR or dev/* build that
          # publishes `local` can be deployed verbatim (incident 2026-06-10:
          # unmerged PR chart on test-2 + instancePrefix "merge" split-brain).
          # AB#4948: the branch clause used to read
          # startsWith('refs/heads/0.2'), which never matched the actual branch
          # name (test/0.2-dev) — so a 0.2 build published no artifact at all.
          # The test-2 dev lane does not depend on it (it checks this repo out
          # and `helm package`s the charts itself), but the condition should say
          # what it means.
          - task: PowerShell@2
            displayName: 'Create version info file'
            condition: and(succeeded(), or(eq(variables.isMain, true), eq(variables.isRelease, true), eq(variables.isTest, true)))
            inputs:
              targetType: 'inline'
              script: |
                New-Item $(build.artifactstagingdirectory)/versioninfo.txt
                Set-Content $(build.artifactstagingdirectory)/versioninfo.txt $(Build.BuildNumber)
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact: local'
            condition: and(succeeded(), or(eq(variables.isMain, true), eq(variables.isRelease, true), eq(variables.isTest, true)))
            inputs:
              ArtifactName: local

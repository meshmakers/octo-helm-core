## Default values for octo-mesh.
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.

# Override of common names
nameOverride: ""

# Override for tag version of images
appVersion: ""

# Log level, per deployment instead of per commit (AB#5478 section 2.3).
#
# nlog.config reads OCTO_LOG_LEVEL for Meshmakers.* and OCTO_LOG_LEVEL_ROOT for
# everything else, both defaulting to Info when unset -- so leaving these empty is
# the normal case and omits the variables entirely.
#
# Raising the level here costs a pod restart. For a one-off investigation prefer
# DiagnosticsService.ReconfigureLogLevelAsync, which changes a RUNNING service's
# level through the API without a redeploy and can target a single logger pattern.
#
# Note what a Debug level now implies: once a service emits JSON, the
# spam-filter-drop-debug-logs rule actually matches it, so the records are dropped
# at Dash0's ingestion rather than stored. Raising the level alone will not make
# them visible -- the filter has to be narrowed too.
logLevel: ""
logLevelRoot: ""

tracing:
  # Export one span per MongoDB command (MongoDB.Driver ActivitySource) through the
  # injected Dash0 auto-instrumentation. Makes database time visible below every
  # server span (AB#6307). Off by default because it multiplies the span volume of
  # database-heavy services; enable per cluster (test-2 first). The services always
  # subscribe to the source; this only controls whether the spans leave the pod.
  mongoDb: false

imageDefaults:
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  # private registry to pull images from
  privateRegistry: ""
  
secrets:
  databaseUser: ""
  databaseAdmin: ""
  streamDataPassword: ""
  rabbitmq: ""
  # Base64-encoded 32-byte AES-256-GCM master key for the Communication
  # Controller's IWorkloadEncryptionService (CommunicationControllerOptions.
  # InstanceSecretKey). Generate ONCE per cluster (`openssl rand -base64 32`)
  # and never rotate — rotating invalidates every encrypted Secret-flagged
  # ValueOverride.Value and every HelmRepositoryConfiguration.Password
  # already persisted on this instance. Empty = encryption service stays
  # disabled (chart emits neither the env var nor the secret key); deploys
  # that touch secret-flagged data then fail with a clear configuration
  # error at runtime, while deploys that do not touch them keep working.
  #
  # AB#5536: the same key is also key `k1` of the SECRET attribute key ring
  # (SecretEncryption:Keys:k1, ActiveKeyId=k1) and the legacy `enc:v1` key
  # (SecretEncryption:LegacyV1Key). Every engine host (identity, asset repo,
  # bot, communication, platform services, AI) receives the ring through the
  # shared system-env block — no additional value is required. Losing this key
  # means every SECRET value must be re-entered; back it up (Vault + Keeper).
  communicationInstanceSecretKey: ""
  # OPTIONAL SECRET key ring override, for key rotation only (AB#5536).
  # Empty (default) = the ring is derived: { k1: communicationInstanceSecretKey }.
  # Non-empty = the map REPLACES the derived ring, so list every key that must
  # still decrypt existing values, e.g. during a rotation:
  #   secretEncryptionKeys:
  #     k1: <communicationInstanceSecretKey>   # still needed until the re-protect sweep ran
  #     k2: <new key, openssl rand -base64 32>
  #   secretEncryptionActiveKeyId: k2
  # Key ids: 1-32 lowercase letters/digits. Values: base64, 32 bytes (validated).
  # LegacyV1Key always stays communicationInstanceSecretKey. Procedure:
  # octo-mesh-deployment/docs/VAULT-SETUP.md.
  secretEncryptionKeys: {}
  # Active key id for new SECRET values. Empty = "k1". Must name a key of the ring.
  secretEncryptionActiveKeyId: ""
  # OPTIONAL missing-key guard (AB#5528 phase 3), default false = unchanged
  # behaviour: an empty ring renders nothing and the services start without it.
  # true = rendering FAILS when the key ring is empty or the instance secret is
  # not a base64 32-byte key (e.g. an unresolved "$(VAULT_instance_secret_key)").
  # Turn it on per cluster once Vault instance_secret_key is verified (and backed
  # up in Keeper) — see octo-mesh-deployment/docs/VAULT-SETUP.md.
  secretEncryptionRequired: false
  # Dash0 browser-RUM ingest auth token (form "auth_..."), Ingesting permission
  # only. Empty = the studio's DASH0_AUTH_TOKEN secret key is not emitted; pair
  # with services.studio.dash0.endpoint. Sourced from Vault at deploy time.
  dash0WebAuthToken: ""
  # content of the root ca certificate chain
  rootCa: ""

clusterDependencies:
  mongodbHost: "octo-mongodb-0.octo-mongodb-svc.mongodb.svc.cluster.local:27017,octo-mongodb-1.octo-mongodb-svc.mongodb.svc.cluster.local:27017,octo-mongodb-2.octo-mongodb-svc.mongodb.svc.cluster.local:27017"
  mongodbReplicaSet: ""
  rabbitMqHost: "rabbitmq.rabbitmq.svc.cluster.local"
  rabbitMqUser: "octo-mq-user"
  streamDataHost: "crate-octo-crate.cratedb.svc.cluster.local"
  streamDataUser: "octo-system"
  # Instance-level StreamData kill switch (StreamDataInstanceConfiguration.Enabled).
  # Default false → matches the C# default, feature is opt-in per cluster. Set to
  # true in clusters that run CrateDB and want tenants to be able to enable
  # StreamData via the asset-rep StreamData controller.
  streamDataEnabled: false
  # CrateDB schema instance prefix (AB#4946, Epic AB#4944). Empty (default) keeps the
  # un-prefixed legacy schema naming - existing instances must never set it. A parallel
  # instance sharing the cluster's CrateDB sets e.g. "dev" so its tenant schemas become
  # dev_{tenantId}. Deliberately separate from serviceDefaults.instancePrefix (RabbitMQ).
  streamDataSchemaInstancePrefix: ""

externalUris:
  # URI of CrateDB to be used by the services
  crateDb: ""
  # URI of the Grafana to be used by the services
  grafana: ""
  # URI of the mesh adapter to be used by the services
  meshAdapter: ""
  # Public URI of the MCP service (octo-mcp chart, deployed separately).
  # Surfaced by platform-services as the `mcpServices` _configuration field.
  # When left empty it is DERIVED as <scheme>://mcp.<domain> using the same
  # scheme/domain resolution as the blueprint runner (serviceDefaults.scheme/
  # .domain win, else derived from services.identity.publicUri) — this matches
  # ${octo.mcp.publicUrl} and the mcp.<domain> host convention on all clusters.
  # Set explicitly only when a cluster deviates from that convention.
  mcp: ""
  # Public URI of the reporting service (octo-mesh-reporting chart in helm-pro,
  # deployed separately). Surfaced by platform-services as the `reportingServices`
  # _configuration field; must match the octo-mesh-reporting chart's publicUri.
  # Leave empty on installations without reporting — consumers read an empty
  # field as "service not part of this installation" (AB#4884).
  reporting: ""
  
serviceDefaults:
  type: ClusterIP
  port: 80
  systemDatabaseName: "OctoSystem"
  # The unique instance prefix of the OctoMesh installation.
  instancePrefix: ""
  # Deployment environment used by the blueprint runner. Surfaced to seed-data /
  # requires: blocks as ${octo.environment}. Conventional values: dev, test,
  # staging, production. Override per cluster in values.yaml; defaults to dev so
  # local helm-install renders never accidentally produce production semantics.
  environment: "dev"
  # URL composition inputs for the blueprint runner: ${octo.scheme}://<slug>.${octo.domain}
  # (e.g. ${octo.mcp.publicUrl} used by the System.Identity.Bootstrap seed for the mcpApi
  # ApiResource Name and the MCP client URIs). When left empty, both are DERIVED from
  # services.identity.publicUri (scheme verbatim; domain = host minus its first label,
  # e.g. https://connect.test-2.mm.cloud -> test-2.mm.cloud), which matches the
  # <service>.<domain> host convention on all clusters. Set explicitly only when a
  # cluster deviates from that convention.
  scheme: ""
  domain: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    # set to allow uploads of big rt model files using import rt function
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # set to prevent "upstream sent too big header while reading response header from upstream"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Emit CORS headers on EVERY response — including the default error pages
    # nginx-ingress generates when an upstream is briefly unavailable (e.g.
    # during a rolling redeploy of identity-services). Without this, the SPA
    # at studio.* sees a misleading "No 'Access-Control-Allow-Origin' header"
    # CORS error instead of the actual 502/503, masking the real cause and
    # preventing proper retry handling on the client. The `always` flag makes
    # OpenResty's more_set_headers directive apply to error responses too.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Access-Control-Allow-Origin: $http_origin" always;
      more_set_headers "Access-Control-Allow-Credentials: true" always;
      more_set_headers "Vary: Origin" always;
  tls: false
  tlsExtra: []
#  tlsExtra:
#    - hosts:
#        - "*.example.com"
#      secretName: example-com-certificate
  
services:
  identity:
    # Public URI of service
    publicUri: ""
    # License key for identity services
    identityServerLicenseKey: ""
    # License key for AutoMapper
    autoMapperLicenseKey: ""
    # AB#5859 role check on the identity service's tenant REST API
    # (OCTO_IDENTITYAPIAUTHORIZATION__ROLEENFORCEMENT). The API requires tenant
    # roles: UserManagement for users/roles/groups, TenantManagement or
    # UserManagement for clients, identity providers etc.
    #   Enforce - callers without the role get 403 (default).
    #   Warn    - emergency exit / transition switch: callers without the role
    #             are let through and the service logs "would be denied with
    #             RoleEnforcement=Enforce (AB#5859)". Revert to Enforce once the
    #             missing role assignments are fixed.
    # Any other value fails the render.
    apiRoleEnforcement: Enforce

    signingKey:
      # certificate with private and public key in pfx format, by command arg
      # Pass via: --set-file services.identity.signingKey.key=IdentityServer4Auth.pfx
      key: ""
      # password of certificate
      password: ""

    # set false to prevent deployment
    deploy: true
    # Use Recreate strategy because the identity service uses exclusive RabbitMQ queues
    # that only allow a single connection at a time. With RollingUpdate the new pod
    # cannot declare the queue while the old pod still holds it (RESOURCE_LOCKED),
    # and the old pod is never torn down because the new one never reaches Ready —
    # the rollout deadlocks until the old pod is manually deleted.
    recreateStrategy: true
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "identity-services"
    image:
      repository: meshmakers/octo-mesh-identity-services
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      # Startup probe gives backend services time to import CK models and run
      # per-tenant initialization before liveness/readiness probes take over.
      # Budget: failureThreshold * periodSeconds = 120 * 5s = 600s (10 minutes).
      startupProbe:
        httpGet:
          path: /healthz/live
          port: http
        periodSeconds: 5
        failureThreshold: 120
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }

  assetRepository:
    # Public URI of service
    publicUri: ""
    # set false to prevent deployment
    deploy: true
    # Use Recreate strategy because the service consumes exclusive RabbitMQ
    # queues; RollingUpdate deadlocks on RESOURCE_LOCKED. See identity for details.
    recreateStrategy: true
    # CK Model Catalog configuration
    ckCatalog:
      # Enable local file system catalog (default: disabled in production)
      localFileSystemEnabled: false
      # Enable private GitHub catalog (default: disabled in production)
      privateGitHubEnabled: false
      # AB#5139 — lane-scoped private CK catalog. Every installation reads the
      # SAME private catalog by default (meshmakers/construction-kit-libraries-build,
      # branch main), so a pre-release instance running alongside a main-lane
      # instance seeds main-lane CK models. Setting these coordinates points ONE
      # installation at its own catalog repository instead.
      # EMPTY STRING MEANS "keep the engine's built-in default" — the template
      # emits each variable only when it is non-empty. Never make the template
      # materialise a value here (no `| default ""` that reaches the env block):
      # an emitted-but-empty OCTO_PrivateOctoGitHub__GitHubRepositoryName wins
      # over the engine default and silently points the catalog at nothing.
      privateGitHub:
        # GitHub organisation / user, e.g. "meshmakers".
        repositoryOwner: ""
        # Repository holding the CK catalog, e.g. "octo-catalog-dev".
        repositoryName: ""
        # Branch the catalog is read from, e.g. "main".
        repositoryBranch: ""
        # GitHub Pages base URI the catalog content is served from,
        # e.g. "https://meshmakers.github.io/octo-catalog-dev/".
        pagesUri: ""
    # Blueprint Catalog configuration (AB#5139). Same lane-scoping as ckCatalog
    # above, for the private blueprint catalog (engine default:
    # meshmakers/blueprint-libraries-build, branch main).
    # Empty string means "keep the engine's built-in default" — see ckCatalog.
    blueprintCatalog:
      # AB#6112: read the private (main-lane, unreleased) blueprint catalog?
      # "" = engine default (enabled), true/false = explicit. Production
      # installations set false so only released blueprints are offered.
      # Needs an engine with AB#6112; older engines ignore it.
      privateGitHubEnabled: ""
      privateGitHub:
        repositoryOwner: ""
        repositoryName: ""
        repositoryBranch: ""
        pagesUri: ""
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "asset-rep-services"
    image:
      repository: meshmakers/octo-mesh-asset-rep-services
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      # Startup probe gives backend services time to import CK models and run
      # per-tenant initialization before liveness/readiness probes take over.
      # Budget: failureThreshold * periodSeconds = 120 * 5s = 600s (10 minutes).
      startupProbe:
        httpGet:
          path: /healthz/live
          port: http
        periodSeconds: 5
        failureThreshold: 120
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }

  bot:
    # Public URI of service
    publicUri: ""
    # set false to prevent deployment
    deploy: true
    # Use Recreate strategy because the bot service uses exclusive RabbitMQ queues
    # that only allow a single connection at a time.
    recreateStrategy: true
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "bot-services"
    image:
      repository: meshmakers/octo-mesh-bot-services
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      # Startup probe gives backend services time to import CK models and run
      # per-tenant initialization before liveness/readiness probes take over.
      # Budget: failureThreshold * periodSeconds = 120 * 5s = 600s (10 minutes).
      startupProbe:
        httpGet:
          path: /healthz/live
          port: http
        periodSeconds: 5
        failureThreshold: 120
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2Gi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }
    # AB#5560 durable storage for the bot's artifacts: pre-sweep secret dumps (AB#5539), tenant dumps and
    # restore staging (concept octo-construction-kit-engine/docs/secret-sweep-dump-storage.md). Every block
    # below is off by default, and the chart then renders exactly what it rendered before.
    #
    # persistence: one PVC for the bot, mounted at mountPath. Interim fallback until the cluster has an
    # object store, and the FileSystem backend of artifactStorage. With persistence enabled the bot gets
    #   OCTO_BOT__SECRETSWEEP__BACKUPSTORAGEPATH = <mountPath>/secret-backups
    # and, unless artifactStorage.provider names an object store,
    #   OCTO_ARTIFACTSTORAGE__PROVIDER = FileSystem, OCTO_ARTIFACTSTORAGE__FILESYSTEM__ROOTPATH = <mountPath>/artifacts
    # ReadWriteOnce only works with replicaCount 1 and recreateStrategy (the bot's defaults). Keep the PVC out
    # of volume-snapshot / Velero / DR backups: the dumps are secret material with a 7-day retention.
    persistence:
      enabled: false
      # empty = the cluster's default StorageClass
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 10Gi
      # use an existing claim instead of creating <bot-fullname>-data
      existingClaim: ""
      mountPath: /data/octo-bot
    # scratch: transient working space for mongodump, tus uploads and downloads, so large files hit a
    # size-limited volume instead of the container's writable layer. Mounted at mountPath (default /tmp, where
    # the bot keeps its temp, tus and dump directories today). Exceeding sizeLimit evicts the pod instead of
    # filling the node disk. Set ephemeralVolume.enabled to back it with a generic ephemeral volume
    # (a PVC that lives as long as the pod) so it never touches the node's disk at all.
    scratch:
      enabled: false
      mountPath: /tmp
      sizeLimit: 20Gi
      # "" (node disk) or "Memory" (tmpfs, counts against the memory limit)
      medium: ""
      ephemeralVolume:
        enabled: false
        storageClass: ""
        size: 20Gi
    # artifactStorage: the platform artifact store (AB#5561), env OCTO_ARTIFACTSTORAGE__*.
    # Keys are <instancePrefix>/<category>/<tenantId>/<file> with categories presweep, tenant-dumps and
    # restore-staging. Credentials are only ever referenced from an existing Secret, never put in values.
    # Retention is app-side (Bot:SecretSweep:BackupRetentionDays = 7, Bot:FileRetentionHours); bucket or
    # container lifecycle rules are the backstop and are set up by the infrastructure, not by this chart.
    artifactStorage:
      # "" = no store configured (FileSystem on the PVC when persistence.enabled), or FileSystem | S3 | AzureBlob
      provider: ""
      # separates several OctoMesh instances sharing one bucket/container; empty = the helm release name
      instancePrefix: ""
      fileSystem:
        # empty = <persistence.mountPath>/artifacts
        rootPath: ""
      s3:
        # endpoint for S3-compatible stores (Hetzner Object Storage, Exoscale SOS); empty = AWS
        serviceUrl: ""
        region: ""
        bucket: ""
        forcePathStyle: false
        # "" or AES256 (SSE-S3)
        serverSideEncryption: ""
        # Secret holding the access key pair; empty = the AWS SDK default credential chain
        existingSecret: ""
        accessKeyIdKey: accessKeyId
        secretAccessKeyKey: secretAccessKey
      azureBlob:
        # https://<account>.blob.core.windows.net; required with useManagedIdentity or accountKeyKey
        accountUrl: ""
        container: ""
        # DefaultAzureCredential, i.e. AKS workload identity: needs serviceAccount (create or name) and
        # workloadIdentityClientId; the pod gets the label azure.workload.identity/use=true
        useManagedIdentity: false
        workloadIdentityClientId: ""
        # Secret with either a connection string or an account key (set exactly one of the two key names)
        existingSecret: ""
        connectionStringKey: ""
        accountKeyKey: ""
    # service account for the bot pod. Not rendered by default (the pod keeps the namespace's default account).
    serviceAccount:
      create: false
      # name of the account to create or use; empty with create=true = the bot's full name
      name: ""
      annotations: {}

  communication:
    # Public URI of service
    publicUri: ""
    # Named public base domains exposed to workloads via the {{domain.NAME}}
    # template syntax in their Hostname, non-secret ValueOverride.Value and
    # ValuesYaml. Resolved at deploy time by the Communication Controller
    # (CommunicationControllerOptions.Domains) so workloads stay portable
    # across clusters. Each map key is surfaced as
    # OCTO_COMMUNICATIONCONTROLLER__DOMAINS__<KEY> and the value as the env-var
    # value. Override per cluster — leave empty here so a fresh helm install
    # without per-cluster overrides simply has no named domains (workloads with
    # literal hostnames keep working; workloads that reference a non-configured
    # domain fail fast at Deploy time with an actionable error).
    #
    # Companion families ({{service.NAME}}, {{context.tenantId}}) are wired
    # automatically: service URLs are derived from services.<name>.publicUri
    # (semantic key "authority" maps to services.identity.publicUri; other
    # keys mirror the helm-section name) and the tenantId is injected per
    # deploy. No values.yaml entries needed for those two families.
    domains: {}
    # HTTP activator (AB#4923): holds a request for a hibernated on-demand workload
    # while it wakes, then forwards it, instead of the ingress answering 502/503.
    # Requires the companion ingress annotation on the workloads — the communication
    # operator must project nginx.ingress.kubernetes.io/default-backend naming THIS
    # service (plus a proxy-read-timeout above the wake budget, since the cluster
    # default of 60s cuts the hold short). Without that annotation nothing routes
    # here and the flag does nothing.
    activatorEnabled: false
    # Staged authorization of the controller's SignalR hubs (AB#5063 adapter hub,
    # AB#5059 operator hub; rollout AB#5528 phase 3). Rendered as
    # OCTO_ADAPTERHUBAUTHORIZATION__MODE / OCTO_OPERATORHUBAUTHORIZATION__MODE.
    #   LogOnly - default: no connection outcome changes; every connection an
    #             enforcing run would refuse is logged ("would be refused when ...")
    #             and counted in octo.communication.hub.authorization.decisions
    #             with outcome=would_refuse.
    #   Enforce - such connections are refused (HubException).
    # Switch a hub to Enforce per cluster only after its would_refuse count has been
    # zero for the review window - see the controller runbook
    # docs/runbooks/hub-authorization-enforce-rollout.md. Operators need
    # communication-operator `operator.authentication.*` credentials first.
    # Any other value fails the render.
    hubAuthorization:
      adapterMode: LogOnly
      operatorMode: LogOnly
    # set false to prevent deployment
    deploy: true
    # Use Recreate strategy because the service consumes exclusive RabbitMQ
    # queues; RollingUpdate deadlocks on RESOURCE_LOCKED. See identity for details.
    recreateStrategy: true
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "communication-controller-services"
    image:
      repository: meshmakers/octo-mesh-communication-controller-services
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      # Startup probe gives backend services time to import CK models and run
      # per-tenant initialization before liveness/readiness probes take over.
      # Budget: failureThreshold * periodSeconds = 120 * 5s = 600s (10 minutes).
      startupProbe:
        httpGet:
          path: /healthz/live
          port: http
        periodSeconds: 5
        failureThreshold: 120
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }

  # Tenant-scoped configuration discovery service. Phase 1 of the
  # octo-platform-services initiative — hosts the `_configuration` endpoint
  # previously served by adminPanel. No broker, no MongoDB, no blueprints,
  # so RollingUpdate is fine (no recreateStrategy).
  platformServices:
    # Public URI of service (e.g. https://platform.example.octo-mesh.com)
    publicUri: ""
    # set false to prevent deployment
    deploy: true
    # Use Recreate strategy because, since Phase 4, the service runs the
    # distribution-event-hub tenant-lifecycle host (it owns the System.UI
    # service-managed blueprints) and consumes exclusive RabbitMQ queues;
    # RollingUpdate deadlocks on RESOURCE_LOCKED. Same as adminPanel / identity.
    recreateStrategy: true
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "platform-services"
    image:
      repository: meshmakers/octo-mesh-platform-services
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      # Startup probe gives the service time to run CK model upgrade/migration
      # across all tenants (Phase 4 tenant-lifecycle host) before liveness takes
      # over — without it, liveness kills the pod after ~75s while startup can
      # exceed 90s, causing a CrashLoopBackOff that never binds the port.
      # Budget: failureThreshold * periodSeconds = 120 * 5s = 600s (10 minutes).
      startupProbe:
        httpGet:
          path: /healthz/live
          port: http
        periodSeconds: 5
        failureThreshold: 120
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 15
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }

  # adminPanel was retired in Phase 4 (AB#4261) — the System.UI CK model + blueprints
  # and the _configuration endpoint moved to platformServices. The service block was
  # removed from the chart; nothing deploys octo-mesh-adminpanel any more.

  studio:
    # Public URI of service
    publicUri: ""
    # Dash0 OpenTelemetry (browser RUM). Per-environment opt-in: leave endpoint
    # empty to disable — the chart then emits no DASH0_* env vars and the studio's
    # telemetry init stays a no-op. Set endpoint (and provide the auth token via
    # secrets.dash0WebAuthToken) only for clusters where Dash0 is activated.
    dash0:
      # OTLP HTTP base URL, excluding the /v1/* prefix (the web SDK appends it),
      # e.g. https://ingress.europe-west4.gcp.dash0.com
      endpoint: ""
      # Dash0 dataset (can also be encoded in the auth token)
      dataset: ""
      # deployment.environment.name resource attribute (e.g. test-2)
      environment: ""
    # set false to prevent deployment
    deploy: false
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "refinery-studio"
    image:
      repository: meshmakers/octo-mesh-refinery-studio
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 15
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }

  # OctoMesh AI Adapter — agent-based engineering host. Phase 1 ships as the
  # single image that also hosts the Claude Code CLI worker subprocess; the
  # split into a separate octo-mesh-ai-worker image lands when subprocess
  # management moves to Kubernetes exec. Default deploy=false because the
  # service is new and the cluster operator opts into KEDA scale-to-zero
  # + image pre-pull explicitly.
  aiServices:
    # Public URI of service
    publicUri: ""
    # set false to prevent deployment
    deploy: false
    # Use Recreate strategy because the service consumes exclusive RabbitMQ
    # queues; RollingUpdate deadlocks on RESOURCE_LOCKED. See identity for details.
    recreateStrategy: true
    # when set, the service will be deployed with the given full name
    fullnameOverride: ""
    # the service will be deployed with the given name and chart name
    nameOverride: "ai-services"
    image:
      repository: meshmakers/octo-mesh-ai-services
      # Overrides the image tag whose default is the chart appVersion.
      # In production set to `:stable`; canary tenants pin `:canary`. See
      # docs/deployment/worker-image.md in octo-ai-services for the tag
      # promotion runbook.
      tag: ""
    replicaCount: 1
    podAnnotations: {}
    podLabels: {}
    pod:
      port: 80
      livenessProbe:
        httpGet:
          path: /healthz/live
          port: http
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: http
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 3
      # Defaults sized from prod-1 steady-state usage (AB#4361). The memory
      # limit bounds the .NET GC heap; no CPU limit to avoid throttling.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }

    # KEDA ScaledObject (#4115 Phase F). Off by default — turn on once
    # the cluster has KEDA installed and the tenant deployment model is
    # decided (single-deployment global scale vs per-tenant pods).
    keda:
      enabled: false
      pollingIntervalSeconds: 30
      cooldownPeriodSeconds: 300
      minReplicaCount: 0
      maxReplicaCount: 5
      # Tenant slug whose active-sessions count drives the scale signal.
      # Single-deployment Phase 1: set to a representative tenant or the
      # placeholder string the adapter's metric endpoint treats as
      # "aggregate". For per-tenant fan-out use `tenants` (below) instead;
      # `tenant` is the fallback when `tenants` is empty.
      tenant: "default"
      # Per-tenant fan-out (#4125). When non-empty, the chart emits one
      # ScaledObject per entry instead of the single global one. Each
      # entry: { name: "tenant-a", targetValue: "2" }. `targetValue` is
      # optional and falls back to the global `targetValue` when omitted
      # so a homogeneous fleet only needs the slug list.
      tenants: [ ]
      # Target sessions-per-replica. Defaults to the Phase-1
      # AiQuotaLimit.ConcurrentJobs (2) so a tenant hitting its
      # ConcurrentJobs cap triggers a scale-up.
      targetValue: "2"
      # Path on the adapter that KEDA scrapes. Default points at the
      # hardened /internal/metrics route added in #4125; the legacy
      # /metrics/keda/active-sessions alias still resolves so existing
      # clusters can migrate without a chart change.
      metricPath: "/internal/metrics/active-sessions"
      # Optional shared-key value the ScaledObject sends as the
      # X-Internal-Metrics-Key header. When set, the adapter requires
      # the same value via `octo__InternalMetricsKey` env. Empty disables
      # the check — NetworkPolicy is the load-bearing safeguard.
      internalMetricsKey: ""

    # Tailscale Operator integration (#4126, ADR-22). When enabled, the
    # chart annotates the ai-services Service with the operator's
    # well-known headers so the Tailscale Operator claims the Service
    # under the given hostname. Concept §6/§10 plans the per-tenant
    # `tenant-{slug}-ai.ts.net` identity on the worker pod (Phase 2);
    # the adapter-side annotation here lets a Phase-1 deployment already
    # expose the adapter REST surface over Tailscale for the bastion CLI.
    tailscale:
      enabled: false
      # Hostname the Tailscale Operator registers in the tailnet. Phase-1
      # default tracks the chart key; per-tenant deployments override.
      hostname: ""

    # Image-Pre-Pull DaemonSet (#4115 Phase F, #4125). Off by default —
    # only useful when keda.enabled scales to zero, otherwise the running
    # replica already holds the image on its node.
    prePull:
      enabled: false
      # Default to nodes labeled `node-role=ai-worker` so an opt-in
      # cluster just labels the worker-class nodes (#4125); override to
      # {} to pre-pull on every node, or to a different selector to
      # target a custom node group (GPU pool, etc.).
      nodeSelector:
        node-role: ai-worker
      # Default tolerations keep pre-pull off tainted/specialised nodes
      # (GPU, storage). Override per cluster if those nodes should also
      # warm the image.
      tolerations: [ ]
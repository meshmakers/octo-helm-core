{{- /*
  KEDA ScaledObject(s) for octo-mesh-ai-services (#4115 Phase F, hardened in #4125).
  Polls the adapter's custom metric endpoint and scales replicas on the
  AiAgentSession count. Conditional on services.aiServices.keda.enabled
  so a cluster without KEDA installed can leave it off.

  Two modes:

  - Single ScaledObject (`keda.tenants` empty/null): one ScaledObject
    targeting `keda.tenant` (the historical Phase-1 default). The
    adapter's metric endpoint aggregates across tenants when called with
    a placeholder slug, so this stays a workable global-scale signal.

  - Per-tenant fan-out (`keda.tenants` set): one ScaledObject per
    tenant slug, each scraping the adapter with the tenant query
    parameter set to its own slug. Each entry can override the
    per-replica target; otherwise the global `keda.targetValue` is used.
    Concept §10 calls this out as the longer-term goal — clusters that
    want it can enable it without forking the chart.

  All ScaledObjects share the same scale target (the single
  ai-services Deployment). Resulting effective max-replicas is the sum
  of per-tenant maxReplicaCount values; the cluster's HPA reconciler
  picks the highest replica count any active trigger demands.
*/}}
{{- $svc := index .Values.services "aiServices" | default dict }}
{{- if and $svc.deploy (and (hasKey $svc "keda") $svc.keda.enabled) }}
{{- $serviceName := include "octo-mesh.service-fullname" (dict "global" . "name" "aiServices" "svc" $svc) }}
{{- $metricBase := printf "http://%s:%v%s" $serviceName $svc.pod.port ($svc.keda.metricPath | default "/internal/metrics/active-sessions") }}
{{- $tenants := $svc.keda.tenants | default list }}
{{- if eq (len $tenants) 0 }}
{{- $tenants = list (dict "name" ($svc.keda.tenant | default "default")) }}
{{- end }}
{{- range $tenants }}
{{- $tenantTarget := .targetValue | default $svc.keda.targetValue | default "2" }}
{{- $tenantSlug := .name }}
{{- $scaledObjectName := printf "%s-%s" $serviceName $tenantSlug }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $scaledObjectName }}
  labels:
    {{- include "octo-mesh.service-selectorLabels" (dict "global" $ "name" "aiServices" "svc" $svc) | nindent 4 }}
    octo-mesh.ai/tenant-slug: {{ $tenantSlug | quote }}
spec:
  scaleTargetRef:
    name: {{ $serviceName }}
  pollingInterval: {{ $svc.keda.pollingIntervalSeconds | default 30 }}
  cooldownPeriod: {{ $svc.keda.cooldownPeriodSeconds | default 300 }}
  minReplicaCount: {{ $svc.keda.minReplicaCount | default 0 }}
  maxReplicaCount: {{ $svc.keda.maxReplicaCount | default 5 }}
  triggers:
    - type: metrics-api
      metadata:
        # KEDA's metrics-api scaler reads JSON; we hit the adapter and
        # pick the `total` field as the scale signal.
        url: "{{ $metricBase }}?tenant={{ $tenantSlug }}"
        valueLocation: "total"
        # targetValue is the number of active sessions one replica should
        # handle. Per-tenant overrides allow heterogeneous fleets (a
        # heavy-usage tenant with targetValue=1, the rest at 2).
        targetValue: {{ $tenantTarget | quote }}
      {{- if $svc.keda.internalMetricsKey }}
      # Per ScaledObject metrics-api auth: the shared key the adapter
      # validates via X-Internal-Metrics-Key. Empty disables the check
      # (NetworkPolicy is the load-bearing safeguard).
      authenticationRef:
        name: {{ $serviceName }}-metrics-auth
      {{- end }}
{{- end }}
{{- if $svc.keda.internalMetricsKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serviceName }}-metrics-auth-secret
  labels:
    {{- include "octo-mesh.service-selectorLabels" (dict "global" . "name" "aiServices" "svc" $svc) | nindent 4 }}
type: Opaque
stringData:
  # Shared key the ScaledObject sends as X-Internal-Metrics-Key.
  X-Internal-Metrics-Key: {{ $svc.keda.internalMetricsKey | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $serviceName }}-metrics-auth
  labels:
    {{- include "octo-mesh.service-selectorLabels" (dict "global" . "name" "aiServices" "svc" $svc) | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: X-Internal-Metrics-Key
      name: {{ $serviceName }}-metrics-auth-secret
      key: X-Internal-Metrics-Key
{{- end }}
{{- end }}

{{- include "checkMandatoryValue" (dict "name" "services.identity.publicUri" "value" .Values.services.identity.publicUri) }}
{{- if .Values.services.assetRepository.deploy -}}  
{{- include "checkMandatoryValue" (dict "name" "services.assetRepository.publicUri" "value" .Values.services.assetRepository.publicUri) }}
{{- end }}
{{- if .Values.services.bot.deploy -}}
{{- include "checkMandatoryValue" (dict "name" "services.bot.publicUri" "value" .Values.services.bot.publicUri) }}
{{- end }}
{{- if .Values.services.communication.deploy -}}
{{- include "checkMandatoryValue" (dict "name" "services.communication.publicUri" "value" .Values.services.communication.publicUri) }}
{{- end }}
{{- if .Values.services.platformServices.deploy -}}
{{- include "checkMandatoryValue" (dict "name" "services.platformServices.publicUri" "value" .Values.services.platformServices.publicUri) }}
{{- end }}

{{- $global := . -}}
{{- range $key, $svc := .Values.services }}
{{ if $svc.deploy -}}
{{- /* AB#5560 optional per-service storage and identity; all off by default. */}}
{{- $ctx := dict "global" $global "name" $key "svc" $svc }}
{{- $persistenceEnabled := dig "persistence" "enabled" false $svc }}
{{- $scratchEnabled := dig "scratch" "enabled" false $svc }}
{{- $serviceAccountName := include "octo-mesh.service-serviceAccountName" $ctx }}
{{- $workloadIdentity := and (eq (include "octo-mesh.bot-artifactProvider" $ctx) "AzureBlob") (dig "artifactStorage" "azureBlob" "useManagedIdentity" false $svc) }}
{{- if and $persistenceEnabled (eq (dig "persistence" "accessMode" "ReadWriteOnce" $svc) "ReadWriteOnce") (or (gt (int $svc.replicaCount) 1) (not $svc.recreateStrategy)) }}
{{- fail (printf "services.%s.persistence with accessMode ReadWriteOnce needs replicaCount 1 and recreateStrategy true." $key) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octo-mesh.service-fullname" (dict "global" $global "name" $key "svc" $svc)  }}
  labels:
    {{- include "octo-mesh.service-selectorLabels" (dict "global" $global "name" $key "svc" $svc)  | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  {{- if $svc.recreateStrategy }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "octo-mesh.service-selectorLabels" (dict "global" $global "name" $key "svc" $svc) | nindent 6 }}
  template:
    metadata:
      {{- with $svc.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "octo-mesh.service-labels" (dict "global" $global "name" $key "svc" $svc) | nindent 8 }}
        {{- with $svc.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $workloadIdentity }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- with $serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $global.Values.imageDefaults.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $global.Values.secrets.rootCa }}
      # InitContainer to update CA certificates
      initContainers:
        - name: update-ca-certs
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              # AB#4498: fail hard when any step fails (e.g. 'apk add' without
              # cluster DNS/egress on a cold start) so kubelet retries the init
              # container instead of starting the service with a CA bundle that
              # lacks the custom root CA.
              set -e
              echo "=== Alpine CA Certificate Setup ==="
              echo "Installing CA certificates package..."
              apk add --no-cache ca-certificates

              echo "Creating CA certificates directory..."
              mkdir -p /usr/local/share/ca-certificates/

              echo "Splitting CA bundle into individual certificates..."
              cd /usr/local/share/ca-certificates/

              # Split the CA bundle into individual certificates using awk
              awk '
              BEGIN { cert_count = 0 }
              /-----BEGIN CERTIFICATE-----/ {
              cert_count++
              filename = sprintf("meshmakers-%02d.crt", cert_count)
              print "Extracting certificate " cert_count " to " filename
              }
              /-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/ {
              if (filename) print > filename
              }
              /-----END CERTIFICATE-----/ {
              close(filename)
              filename = ""
              }
              ' /mounted-certs/root-ca.pem

              echo "Individual certificates created:"
              ls -la /usr/local/share/ca-certificates/meshmakers-*.crt

              echo "Updating CA certificates..."
              update-ca-certificates

              echo "Verifying CA certificate integration..."
              if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
              cert_count=$(grep -c "BEGIN CERTIFICATE" /etc/ssl/certs/ca-certificates.crt)
              echo "✓ Total certificates in bundle: $cert_count"
              fi

              echo "Copying updated bundle to shared volume..."
              cp /etc/ssl/certs/ca-certificates.crt /shared-certs/ca-certificates.crt
              cp -r /etc/ssl/certs/ /shared-certs/

              echo "✓ CA certificates updated for Alpine successfully"
          volumeMounts:
            - name: custom-ca-certs
              mountPath: /mounted-certs
              readOnly: true
            - name: updated-ca-certs
              mountPath: /shared-certs
      {{- end }}
      containers:
      - name: {{ $key | lower }}
        {{- if $global.Values.imageDefaults.privateRegistry }}
        image: "{{ $global.Values.imageDefaults.privateRegistry }}/{{ $svc.image.repository }}:{{ $svc.image.tag | default $global.Values.appVersion | default $global.Chart.AppVersion }}"
        {{- else }}
        image: "{{ $svc.image.repository }}:{{ $svc.image.tag | default $global.Values.appVersion | default $global.Chart.AppVersion }}"
        {{- end }}
        imagePullPolicy: {{ $global.Values.imageDefaults.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ $svc.pod.port }}
            protocol: TCP
        env:
          {{- include "octo-mesh.env" (dict "global" $global "name" $key "svc" $svc) | nindent 8 }}
        {{- with $svc.pod.startupProbe}}
        startupProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with $svc.pod.livenessProbe}}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with $svc.pod.readinessProbe}}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with $svc.pod.resources}}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if or $svc.signingKey $svc.pod.volumeMounts $global.Values.secrets.rootCa $persistenceEnabled $scratchEnabled }}
        volumeMounts:
        {{- end }}
        {{- with $svc.pod.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $svc.signingKey }}
        - name: signin-key-volume
          mountPath: /etc/octo-identity
        {{- end }}
        {{- if $global.Values.secrets.rootCa }}
        - name: updated-ca-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        {{- end }}
        {{- if $persistenceEnabled }}
        - name: data
          mountPath: {{ $svc.persistence.mountPath }}
        {{- end }}
        {{- if $scratchEnabled }}
        - name: scratch
          mountPath: {{ $svc.scratch.mountPath | default "/tmp" }}
        {{- end }}
      {{- if or $svc.signingKey $svc.pod.volumes $global.Values.secrets.rootCa $persistenceEnabled $scratchEnabled }}
      volumes:
      {{- end }}
      {{- with $svc.pod.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $svc.signingKey }}
      - name: signin-key-volume
        secret:
          secretName: {{ printf "%s-signing-key" (include "octo-mesh.fullname" $global) }}
      {{- end }}
      {{- if $global.Values.secrets.rootCa }}
      - name: custom-ca-certs
        secret:
          secretName: {{ printf "%s-ca" (include "octo-mesh.fullname" $global) }}
      - name: updated-ca-certs
        emptyDir: {}
      {{- end }}
      {{- if $persistenceEnabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "octo-mesh.service-persistenceClaimName" $ctx }}
      {{- end }}
      {{- if $scratchEnabled }}
      - name: scratch
        {{- if dig "scratch" "ephemeralVolume" "enabled" false $svc }}
        ephemeral:
          volumeClaimTemplate:
            metadata:
              labels:
                {{- include "octo-mesh.service-selectorLabels" $ctx | nindent 16 }}
            spec:
              accessModes:
                - ReadWriteOnce
              {{- with $svc.scratch.ephemeralVolume.storageClass }}
              storageClassName: {{ . | quote }}
              {{- end }}
              resources:
                requests:
                  storage: {{ $svc.scratch.ephemeralVolume.size | default "20Gi" }}
        {{- else }}
        emptyDir:
          {{- with $svc.scratch.medium }}
          medium: {{ . }}
          {{- end }}
          {{- with $svc.scratch.sizeLimit }}
          sizeLimit: {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with $svc.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---

{{- end }}
{{- end }}
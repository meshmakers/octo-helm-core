{{- /*
AB#5560 optional ServiceAccount per service (services.<svc>.serviceAccount.create). Used by the bot for
AKS workload identity against the artifact store: the client id annotation comes from
artifactStorage.azureBlob.workloadIdentityClientId when useManagedIdentity is set.
*/}}
{{- $global := . -}}
{{- range $key, $svc := .Values.services }}
{{- if and $svc.deploy (dig "serviceAccount" "create" false $svc) }}
{{- $ctx := dict "global" $global "name" $key "svc" $svc }}
{{- $annotations := dig "serviceAccount" "annotations" dict $svc }}
{{- $clientId := "" }}
{{- if dig "artifactStorage" "azureBlob" "useManagedIdentity" false $svc }}
{{- $clientId = dig "artifactStorage" "azureBlob" "workloadIdentityClientId" "" $svc }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "octo-mesh.service-serviceAccountName" $ctx }}
  labels:
    {{- include "octo-mesh.service-selectorLabels" $ctx | nindent 4 }}
  {{- if or $annotations $clientId }}
  annotations:
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $clientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}

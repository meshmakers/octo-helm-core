{{- $global := . -}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "octo-mesh.fullname" . -}}
{{- $svcPort := .Values.serviceDefaults.port -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- /* AB#6174: ingress.proxyBodySize feeds proxy-body-size unless an explicit annotation is set. */}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if and .Values.ingress.proxyBodySize (not (hasKey $annotations "nginx.ingress.kubernetes.io/proxy-body-size")) }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" (toString .Values.ingress.proxyBodySize) }}
{{- end }}
{{- /*
  AB#5868: /metrics must never be reachable through the public ingress (tenant ids, pipeline names and pool
  ids in the Prometheus export, no authentication). The services already refuse /metrics on the port the
  ingress routes to; this is the second layer. It is appended to the configuration-snippet AFTER any
  override from ingress.annotations, so a cluster overlay that replaces the snippet cannot drop it.
  $uri is the decoded, normalized path, so /Metrics, //metrics and /%6Detrics are covered too.
*/}}
{{- $metricsGuard := `if ($uri ~* "^/+metrics(/.*)?$") { return 404; }` }}
{{- $snippet := index $annotations "nginx.ingress.kubernetes.io/configuration-snippet" | default "" | trimSuffix "\n" }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/configuration-snippet" (printf "%s\n# AB#5868: never serve /metrics through the ingress\n%s\n" $snippet $metricsGuard) }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "octo-mesh.labels" .  | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tlsExtra }}
  tls:
    {{- with .Values.ingress.tlsExtra }}
    {{- toYaml . | nindent 2 }}
    {{- end }}
  {{- else }}
  tls:
  - hosts:
      {{- range .Values.services  }}
      {{- if .deploy }}
      - {{ .publicUri | replace "https://" "" | trimSuffix "/" | quote }}
      {{- end }}
      {{- end }}
    secretName: {{ $fullName }}
  {{- end }}
  rules:
  {{- range $key, $svc := .Values.services }}
  {{- if .deploy }}
  - host: {{ .publicUri | replace "https://" "" | trimSuffix "/" | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "octo-mesh.service-fullname" (dict "global" $global "name" $key "svc" $svc)  }}
            port:
              number: {{ $svcPort }}
  {{- end }}
  {{- end }}
{{- end }}

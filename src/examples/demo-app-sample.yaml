
# This will pass the client id to the demo app
clientId: "octo-demo-app"

# The public uri of the demo app
publicUri: https://demoapp.example.com
# URI of the _configuration discovery endpoint — served by platform-services
# (admin-panel was retired in Phase 4). Wired through the legacy ADMIN_PANEL_URI env var.
adminPanelUri: https://platform.example.com

image:
  privateRegistry: <registry url>
  tag: 3.1.0
  
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "demo"
  tls: true
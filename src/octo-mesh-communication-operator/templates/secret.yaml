{{- include "octoMeshCommunicationOperator.webhookCerts" . -}}
{{- $certs := index $ "_webhookCerts" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-webhook-ca" (include "octoMeshCommunicationOperator.fullname" .) }}
  labels:
    {{- include "octoMeshCommunicationOperator.labels" . | nindent 4 }}
type: Opaque
data:
  ca-key.pem: {{ $certs.caKey | b64enc | quote }}
  ca.pem: {{ $certs.caCrt | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-webhook-cert" (include "octoMeshCommunicationOperator.fullname" .) }}
  labels:
    {{- include "octoMeshCommunicationOperator.labels" . | nindent 4 }}
type: Opaque
data:
  svc-key.pem: {{ $certs.svcKey | b64enc | quote }}
  svc.pem: {{ $certs.svcCrt | b64enc | quote }}
---
{{- if .Values.secrets.rootCa }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ca" (include "octoMeshCommunicationOperator.fullname" .) }}
  labels:
    {{- include "octoMeshCommunicationOperator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "checkMandatoryValue" (dict "name" "secrets.rootCa" "value" .Values.secrets.rootCa) }}
  root-ca.pem: {{ .Values.secrets.rootCa | b64enc | quote }}
{{- end }}
{{- if .Values.operator.autoManageDeploymentSites }}
{{- /* Central mode mandatories — autoManageDeploymentSites=true requires the
       operator to talk to a controller AND own per-tenant broker
       secrets, so all four values MUST be supplied. */}}
{{- include "checkMandatoryValue" (dict "name" "operator.communicationControllerUri" "value" .Values.operator.communicationControllerUri) }}
{{- include "checkMandatoryValue" (dict "name" "broker.host" "value" .Values.broker.host) }}
{{- include "checkMandatoryValue" (dict "name" "broker.username" "value" .Values.broker.username) }}
{{- include "checkMandatoryValue" (dict "name" "broker.password" "value" .Values.broker.password) }}
{{- end }}
{{- /* The <fullname>-broker Secret is rendered whenever username +
       password are present, regardless of mode. Edge operators need
       it too so the WorkloadReconciler can read BrokerPassword from
       env and inject secrets.rabbitmq into adapter Helm releases via
       AppendClusterSecrets. Defaults are empty strings → no Secret
       and no broker env vars are rendered, keeping the chart
       backward compatible. */}}
{{- if and .Values.broker.username .Values.broker.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-broker" (include "octoMeshCommunicationOperator.fullname" .) }}
  labels:
    {{- include "octoMeshCommunicationOperator.labels" . | nindent 4 }}
type: Opaque
data:
  broker-user: {{ .Values.broker.username | b64enc | quote }}
  broker-password: {{ .Values.broker.password | b64enc | quote }}
{{- end }}
{{- $cs := .Values.operator.clusterSecrets }}
{{- $ironOcr := .Values.operator.ironOcrLicenseKey }}
{{- $dash0Token := .Values.operator.dash0.webAuthToken }}
{{- $ring := fromJson (include "octoMeshCommunicationOperator.secretEncryption" .) }}
{{- if or $cs.mongodbUserPassword $cs.mongodbAdminPassword $cs.streamDataPassword $ironOcr $dash0Token $ring.keys $ring.legacyV1Key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-cluster-secrets" (include "octoMeshCommunicationOperator.fullname" .) }}
  labels:
    {{- include "octoMeshCommunicationOperator.labels" . | nindent 4 }}
type: Opaque
data:
{{- with $cs.mongodbUserPassword }}
  mongodb-user-password: {{ . | b64enc | quote }}
{{- end }}
{{- with $cs.mongodbAdminPassword }}
  mongodb-admin-password: {{ . | b64enc | quote }}
{{- end }}
{{- with $cs.streamDataPassword }}
  stream-data-password: {{ . | b64enc | quote }}
{{- end }}
{{- /* AB#5536 — SECRET attribute key ring, one entry per key id plus the legacy v1 key. */}}
{{- range $kid, $key := $ring.keys }}
  {{ printf "secret-encryption-key-%s" $kid }}: {{ $key | b64enc | quote }}
{{- end }}
{{- with $ring.legacyV1Key }}
  secret-encryption-legacy-v1-key: {{ . | b64enc | quote }}
{{- end }}
{{/*
  AB#5449 — IronOCR licence key. Shares this Secret with the data-store
  credentials because both are cluster-side values the operator reads at
  startup, but it is NOT part of `clusterSecrets`: that block is gated on the
  workload's `ReceivesClusterSecrets` opt-in, and OCR has nothing to do with
  data-store access. The operator decides per CHART which workloads receive it.
  Hence also the widened `if` above — the Secret must exist when the licence is
  the only value configured, which is the case on a cluster whose adapters get
  their database credentials some other way.
*/}}
{{- with $ironOcr }}
  ironocr-license-key: {{ . | b64enc | quote }}
{{- end }}
{{/*
  Dash0 browser-RUM ingest token. Same reasoning as the IronOCR key: a
  cluster-side value the operator reads at startup and hands on per chart, not
  part of `clusterSecrets` and not tied to the ReceivesClusterSecrets opt-in.
  It is kept out of the plain env (and out of the context-values file) so it
  does not sit in a rendered manifest — though note it is a token the browser
  receives by design, so this is hygiene, not confidentiality.
*/}}
{{- with $dash0Token }}
  dash0-web-auth-token: {{ . | b64enc | quote }}
{{- end }}
{{- end }}
{{- /*
AB#5528 phase 3 — operator client credentials (chart-owned variant). Rendered only
when operator.authentication.clientId/clientSecret are supplied; an existingSecret
is referenced as-is and never rendered here.
*/}}
{{- $auth := fromJson (include "octoMeshCommunicationOperator.authentication" .) }}
{{- if $auth.chartOwned }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $auth.secretName }}
  labels:
    {{- include "octoMeshCommunicationOperator.labels" . | nindent 4 }}
type: Opaque
data:
  client-id: {{ .Values.operator.authentication.clientId | b64enc | quote }}
  client-secret: {{ .Values.operator.authentication.clientSecret | b64enc | quote }}
{{- end }}

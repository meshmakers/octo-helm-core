# Default values for octoMeshCommunicationOperator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

octo-mesh-crds:
  enabled: true
  
configMap:
  kestrelHttpUrl: http://0.0.0.0:5000
  kestrelHttpsUrl: https://0.0.0.0:5001
  certKeyPath: /certs/svc-key.pem
  certPath: /certs/svc.pem

replicaCount: 1

serviceHooks:
  # certificate with private and public key in pfx format, by command arg 
  caKey: ""
  caCrt: ""
  svcKey: ""
  svcCrt: ""

pod:
  httpPort: 5000
  httpsPort: 5001

image:
  repository: meshmakers/octo-communication-operator
  pullPolicy: IfNotPresent
  # private registry to pull images from
  privateRegistry: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""  
  
secrets:
  # content of the root ca certificate chain
  rootCa: ""

imagePullSecrets: []

# Extra /etc/hosts entries for the operator pod, e.g.
#   - ip: 192.168.65.254
#     hostnames: [mac.local]
# Used where the controller is reachable at an address its TLS certificate does
# not name (typical for a local kind cluster talking to a host-run controller).
hostAliases: []
nameOverride: ""
# Default fullname is `communication-operator` so K8s resource names don't
# inherit the Helm release name as a prefix. Every operator install lives
# in its own namespace (Cloud: a single `octo` install; Edge: per-target-
# cluster `octo-op-{target_cluster}-{instance_prefix}` install — see
# meshmakers-infrastructure edge-deployment), so the release name is
# redundant in the resource name. Override to a fixed value here lets two
# operators on the same cluster coexist as long as they're in different
# namespaces — which Modell B already guarantees. Override to "" via -f/
# --set if you want the legacy `{release}-communication-operator` shape.
fullnameOverride: "communication-operator"

# Name of image pull secret to apply to adapter pods created by the operator.
# When set, adapter deployments include this secret for pulling container images.
adapterImagePullSecretName: ""

# === RBAC scope ===
# Controls whether the operator gets cluster-wide or namespace-scoped Kubernetes
# permissions. Cluster scope is the historical default and matches the previous
# chart behaviour. Namespace scope is required when running multiple operator
# instances on the same cluster (e.g. one per target communication controller
# on an edge device) so that each operator's RBAC stays within its own
# namespace and they don't compete for the same CommunicationPool CRs. Pair
# namespace scope with `operator.watchNamespace` so the CR watcher matches the
# RBAC reach.
rbac:
  # "cluster" → ClusterRole + ClusterRoleBinding (default; backward compatible)
  # "namespace" → Role + RoleBinding scoped to .Release.Namespace
  scope: cluster

# === Central operator mode ===
# Controls whether the operator runs as a "central operator" — i.e. it connects
# to the Communication Controller via SignalR (/operatorHub) and listens for
# tenant lifecycle events. When enabled, the operator auto-creates and auto-
# deletes CommunicationPool CRs and per-tenant broker secrets.
# When disabled (default), the operator only reconciles CommunicationPool CRs
# created externally (edge deployment).
operator:
  # Master switch for central operator mode. When true,
  # `operator.communicationControllerUri`, `broker.host`, `broker.username`,
  # and `broker.password` MUST be set.
  autoManagePools: false

  # Restricts the operator's CR watcher to a single namespace. When empty
  # (default), the operator watches all namespaces cluster-wide. Set this to
  # `.Release.Namespace` (or the same namespace value used at install time)
  # when running multiple operator instances on one cluster — without it, the
  # KubeOps watcher sees every CommunicationPool CR in the cluster and
  # multiple operators will fight over the same resources. Typically paired
  # with `rbac.scope=namespace`.
  watchNamespace: ""

  # Cluster-internal URI of the Communication Controller. The /operatorHub
  # SignalR path is appended by the operator. Typical value:
  # https://octo-mesh-communication-controller-services
  communicationControllerUri: ""

  # Controller URI projected into the Helm values of every deployed workload. Empty
  # (default) projects communicationControllerUri, which is correct wherever operator
  # and workloads resolve the same name the same way. Set it when the operator needs
  # an address the workloads cannot use - observed on local kind clusters, where the
  # operator reaches a host-run controller through a name only it can be given, and
  # every adapter then sits at Unregistered while the operator looks healthy (AB#4967).
  workloadCommunicationControllerUri: ""

  # Namespace where auto-created CommunicationPool CRs, per-tenant broker
  # secrets, and the resulting adapter Deployments/Services are placed. All
  # artefacts of a managed pool live here. Must exist before installation.
  poolNamespace: octo

  # Pool name used in auto-created CommunicationPool CRs.
  defaultPoolName: default

  # Forwarded to adapter pods as OCTO_ADAPTER__INSTANCEPREFIX. Disambiguates
  # OctoMesh installations that share the same RabbitMQ broker.
  instancePrefix: ""

  # NOTE: currently a no-op (AB#5232 audit) — the option is bound into the
  # operator but never projected into any workload, and no workload chart has
  # an ignoreCertificateValidation value. Workload trust is delivered via
  # secrets.rootCa (projected into every workload) instead. Kept only so
  # existing values files keep rendering.
  adapterIgnoreCertificateValidation: false

  # Cluster-internal URI of the reporting service. Projected into each
  # workload's Helm values as `reportingServiceUri`. Leave empty in edge
  # clusters that do not host a reporting service.
  reportingServiceUri: ""

  # Public URI of the identity service issuing the access tokens that secured
  # trigger nodes accept. Projected into each workload's Helm values as
  # `authUri`. Use the public issuer address, not a cluster-internal service
  # name — the adapter treats it as the expected issuer of the token, not just
  # as an address to fetch signing keys from. Leave empty in clusters whose
  # workloads expose no secured routes.
  authUri: ""

  # Additional token issuer values every deployed workload accepts on top of
  # authUri (split-horizon setups, AB#5232). Rendered as indexed
  # OPERATOR__ADDITIONALVALIDISSUERS__<n> env vars; the operator projects the
  # list into each workload's Helm values as `additionalValidIssuers`, which
  # the adapter chart turns into OCTO_ADAPTER__ADDITIONALVALIDISSUERS__<n>.
  # Only the issuer STRING comparison is widened — signing keys still come
  # from authUri's discovery document. Canonical use: the local kind dev
  # cluster, where adapters reach identity via
  # https://host.docker.internal:5003 while host-side callers mint tokens via
  # https://localhost:5003/.
  # Example:
  #   additionalValidIssuers:
  #     - https://localhost:5003/
  additionalValidIssuers: []

  # Private container registry the cluster pulls workload images from
  # (e.g. "docker.mm.cloud"). When set, projected into each workload's
  # `image.privateRegistry` so the chart renders the image reference as
  # `{registry}/{repository}:{tag}` instead of pulling from docker.io.
  imageRegistry: ""

  # Cluster-internal service endpoints projected into every deployed
  # workload's Helm values. Each field is optional — only those that are
  # set are injected. Edge operators typically leave the cloud-side hosts
  # empty so per-workload values can supply local equivalents.
  clusterDependencies:
    mongodbHost: ""
    mongodbReplicaSet: ""
    rabbitMqHost: ""
    rabbitMqUser: ""
    streamDataHost: ""
    streamDataUser: ""
    # Instance isolation (Epic AB#4944). Both are forwarded into every deployed
    # workload's values and must mirror what the core services run with — a workload
    # resolves its tenant through the system database, and writes stream data into the
    # prefixed CrateDB schema. Leave empty on a single-instance cluster: the workloads
    # then keep the compiled-in "OctoSystem" and the unprefixed schema names.
    systemDatabaseName: ""
    streamDataSchemaInstancePrefix: ""

  # Cluster-wide ingress defaults projected into every deployed workload's
  # Helm values. Per-workload ValuesYaml or structured overrides can still
  # override individual annotations.
  ingress:
    className: ""
    clusterIssuer: ""
    # tls: true / false — leave unset to keep the chart default.
    tls: ""
    # Additional annotations projected into every workload's
    # ingress.annotations (merged with the cluster-issuer annotation).
    # Keys may contain dots/slashes — the chart binds them as indexed
    # OPERATOR__INGRESS__ANNOTATIONS__n__NAME/__VALUE env pairs.
    # Example:
    #   annotations:
    #     nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    annotations: {}

  # Cluster-side credentials the operator may inject into workloads that
  # opt in via Adapter.ReceivesClusterSecrets. Each field is optional —
  # only those that are set get packaged into the chart-owned
  # `<fullname>-cluster-secrets` Secret and referenced by the operator via
  # secretKeyRef. The RabbitMQ password reuses the existing `broker.password`
  # value; everything else lives here. Override these in production via the
  # deployment pipeline (Vault) rather than by checking values into git.
  clusterSecrets:
    mongodbUserPassword: ""
    mongodbAdminPassword: ""
    streamDataPassword: ""
    # SECRET attribute key ring (AB#5536), injected into workloads with
    # ReceivesClusterSecrets=true as `secrets.secretEncryption.*` (the mesh
    # adapter renders OCTO_SECRETENCRYPTION__* from it). Set instanceSecretKey
    # to the SAME value as the core chart's secrets.communicationInstanceSecretKey
    # (Vault `instance_secret_key`): it becomes key `k1` (active) and the legacy
    # `enc:v1` key. Empty = no key ring is injected; adapters then start, but
    # writing or reading a SECRET attribute fails with a configuration error.
    instanceSecretKey: ""
    # OPTIONAL rotation override — a non-empty map REPLACES the derived
    # { k1: instanceSecretKey } ring, so list every key still needed to decrypt
    # (see octo-mesh-deployment/docs/VAULT-SETUP.md). Key ids: 1-32 lowercase
    # letters/digits; values: base64, 32 bytes (validated at render time).
    secretEncryptionKeys: {}
    # Active key id for new SECRET values. Empty = "k1".
    secretEncryptionActiveKeyId: ""
    # OPTIONAL missing-key guard (AB#5528 phase 3), default false = unchanged.
    # true = rendering FAILS when the key ring is empty or instanceSecretKey is
    # not a base64 32-byte key (e.g. an unresolved "$(VAULT_instance_secret_key)").
    # Enable on central clusters once Vault instance_secret_key is verified; keep
    # it off on edge operators that run without a key ring by design.
    secretEncryptionRequired: false

  # IronOCR licence key (AB#5449), projected by the operator as the
  # secret-flagged value override `secrets.ironOcrLicenseKey` into the workloads
  # whose chart reads it — today only `octo-mesh-adapter`, which hosts the
  # `PdfOcrExtraction@1` node. One licence covers the whole estate, so it lives
  # cluster-side here rather than per workload, the same way `broker.password`
  # does. Set it in production via the deployment pipeline (Vault), never by
  # checking a value into git.
  #
  # Deliberately NOT under `clusterSecrets`: that block is gated on the
  # workload's `ReceivesClusterSecrets` opt-in, which means "this adapter talks
  # to the cluster's data stores" and says nothing about OCR. The operator gates
  # this one on the chart name instead.
  #
  # Empty is a supported state: an adapter deployed without the key starts
  # normally and fails only when a document actually needs OCR, naming the
  # setting. Before AB#5449 the key was a literal in the adapter's source, so
  # every rotation was a code change and every clone carried a live key.
  ironOcrLicenseKey: ""

  # Dash0 browser RUM (OpenTelemetry) for the frontends this operator rolls out
  # as tenant workloads: meshmakers-app, energy-community-app and the four
  # landing pages. The non-secret half below is projected into EVERY workload's
  # context values; the ingest token is gated on the chart name, exactly like
  # ironOcrLicenseKey above, so only the frontend charts receive it.
  #
  # Per-environment opt-in: leave `endpoint` empty and the operator emits no
  # dash0 values at all, which the apps read as "Dash0 is not activated here"
  # and skip SDK initialisation. Nothing else changes.
  #
  # ⚠️ `webAuthToken` must be created with the Ingesting permission ONLY. It is
  # served to every visitor inside the page and is readable in any dev-tools
  # session — handling it as a secret here keeps it out of rendered manifests
  # and tenant databases, it does not make the value confidential. Set it from
  # Vault via the deployment pipeline, never by checking a value into git.
  dash0:
    # OTLP/HTTP ingress base URL, excluding the /v1/* prefix (the web SDK
    # appends it), e.g. https://ingress.europe-west4.gcp.dash0.com
    endpoint: ""
    # Dash0 dataset (can also be encoded in the auth token), e.g. "prod-1".
    dataset: ""
    # Reported as deployment.environment; conventionally the cluster name, so
    # RUM and backend telemetry from one cluster group together.
    environment: ""
    webAuthToken: ""

  # Client-credentials login the operator authenticates its own /operatorHub
  # connection with (AB#5062; rollout AB#5528 phase 3 - the controller's
  # operator-hub gate AB#5059 can only go to Enforce once every operator sends a
  # token). Maps onto OperatorOptions.Authentication:
  #   OPERATOR__AUTHENTICATION__ISSUERURI / __TENANTID     (plain env)
  #   OPERATOR__AUTHENTICATION__CLIENTID  / __CLIENTSECRET (secretKeyRef)
  #
  # OPTIONAL. Nothing is rendered unless clientId or existingSecret is set, and
  # the operator then connects anonymously exactly as before (it logs one
  # startup warning saying so). Credentials come from ONE of two sources:
  #   a) clientId + clientSecret - packaged into the chart-owned Secret
  #      <fullname>-operator-auth (the deploy pipeline writes both from Vault
  #      into its temporary secrets values file, never into git), or
  #   b) existingSecret - the name of a Secret in the release namespace that
  #      holds the two keys below (manual / edge installs).
  # Setting both, or only one half of a), fails the render.
  authentication:
    # Public issuer URI of the identity service the client is registered in.
    # Empty = operator.authUri (the same identity service on every cluster
    # today). Must be the public issuer, not a cluster-internal service name.
    issuerUri: ""
    # Tenant the client is registered in, sent as acr_values=tenant:<id>.
    # REQUIRED when credentials are configured: the installation's system
    # tenant, normally "octosystem". Never one of the tenants the operator
    # manages (a tenant delete would take the fleet credential with it).
    tenantId: ""
    clientId: ""
    clientSecret: ""
    existingSecret: ""
    existingSecretClientIdKey: clientId
    existingSecretClientSecretKey: clientSecret

# === RabbitMQ broker for adapter pods ===
# These connection details are written by the operator into per-tenant
# `<tenantId>-<poolName>-octo-mesh-connection` Secrets, which adapter pods
# consume. Required when `operator.autoManagePools` is true.
broker:
  # Hostname of the RabbitMQ broker. In-cluster typically the Service name.
  host: ""

  # AMQP virtual host. Default "/" works for stock RabbitMQ.
  virtualHost: "/"

  # AMQP port. 5672 = plain, 5671 = TLS.
  port: 5672

  # Credentials are rendered into a Helm-managed Kubernetes Secret and
  # injected into the operator pod via secretKeyRef — they do NOT appear in
  # the rendered Deployment manifest. In production, override via --set,
  # External Secrets, or Sealed Secrets.
  username: ""
  password: ""


podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 443

resources:
  # The operator forks the helm CLI for every workload deploy. helm parses the
  # full chart index (hundreds of versions), renders templates, and talks to
  # the apiserver — together with the .NET host's working set this routinely
  # exceeds the scaffold-default 128Mi and the container gets OOM-killed
  # (exitCode 137) mid-deploy, then restarts and retries the same event in a
  # loop. 512Mi gives helm + index parsing comfortable headroom on every
  # cluster size.
  # CPU is just as load-bearing as memory (AB#4876 rollout, 2026-08-26): a
  # single helm dry-run/upgrade of the 3.4.x adapter chart burns several CPU
  # minutes, and a throttled operator stretches it to 20–35 min wall-clock per
  # tenant — a fleet rollout then outlives every CD verify window. 1 full core
  # keeps one helm invocation unthrottled; the deploy queue is sequential, so
  # there is never more than one.
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  timeoutSeconds: 1
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

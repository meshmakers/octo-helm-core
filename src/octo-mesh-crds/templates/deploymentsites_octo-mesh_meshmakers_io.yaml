apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deploymentsites.octo-mesh.meshmakers.io
  annotations:
    # Prevent Helm from ever deleting this CRD as part of an
    # upgrade-removes-resource diff. Without this, an unrelated Helm
    # release that previously bundled the CRD (e.g. the operator
    # chart in pre-2026-05 deployments) can wipe it on its next
    # upgrade when its own subchart drops the CRD. The standalone
    # `octo-mesh-crds` release is the sole owner; `keep` makes that
    # ownership truly authoritative.
    "helm.sh/resource-policy": keep
spec:
  group: octo-mesh.meshmakers.io
  names:
    kind: DeploymentSite
    listKind: DeploymentSiteList
    plural: deploymentsites
    singular: deploymentsite
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          status:
            nullable: false
            properties:
              communicationStatus:
                nullable: false
                type: string
            type: object
          spec:
            nullable: false
            properties:
              # The CR is an intent record: "the operator that watches this
              # namespace should manage deployment site {deploymentSiteRtId} for tenant
              # {tenantId}". Controller URI, broker host / port / virtualHost,
              # instancePrefix and cert-validation toggles all live on the
              # operator instance (OperatorOptions / OPERATOR__* env vars)
              # and are not duplicated on the CR. The deployment site's user-facing
              # display name lives on the controller's RtDeploymentSite.Name attribute
              # (visible in Studio) and is not carried on the CR.
              tenantId:
                nullable: false
                type: string
              deploymentSiteRtId:
                nullable: false
                type: string
                description: "24-character lowercase hex MongoDB ObjectId of the controller-side RtDeploymentSite entity. Canonical deployment site identity."
                pattern: "^[a-f0-9]{24}$"
            required:
              - tenantId
              - deploymentSiteRtId
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

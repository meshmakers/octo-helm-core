apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: communicationpools.octo-mesh.meshmakers.io
spec:
  group: octo-mesh.meshmakers.io
  names:
    kind: CommunicationPool
    listKind: CommunicationPoolList
    plural: communicationpools
    singular: communicationpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          status:
            nullable: false
            properties:
              communicationStatus:
                nullable: false
                type: string
            type: object
          spec:
            nullable: false
            properties:
              # The CR is an intent record: "the operator that watches this
              # namespace should manage pool {poolName} for tenant
              # {tenantId}". Controller URI, broker host / port / virtualHost,
              # instancePrefix and cert-validation toggles all live on the
              # operator instance (OperatorOptions / OPERATOR__* env vars)
              # and are no longer duplicated on the CR — see the
              # octo-communication-operator refactor that reduces
              # V1CommunicationPoolEntitySpec to the two fields below.
              tenantId:
                nullable: false
                type: string
              poolName:
                nullable: false
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: communicationpools.octo-mesh.meshmakers.io
  annotations:
    # Prevent Helm from ever deleting this CRD as part of an
    # upgrade-removes-resource diff. Without this, an unrelated Helm
    # release that previously bundled the CRD (e.g. the operator
    # chart in pre-2026-05 deployments) can wipe it on its next
    # upgrade when its own subchart drops the CRD. The standalone
    # `octo-mesh-crds` release is the sole owner; `keep` makes that
    # ownership truly authoritative.
    "helm.sh/resource-policy": keep
spec:
  group: octo-mesh.meshmakers.io
  names:
    kind: CommunicationPool
    listKind: CommunicationPoolList
    plural: communicationpools
    singular: communicationpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          status:
            nullable: false
            properties:
              communicationStatus:
                nullable: false
                type: string
            type: object
          spec:
            nullable: false
            properties:
              # The CR is an intent record: "the operator that watches this
              # namespace should manage pool {poolRtId} for tenant
              # {tenantId}". Controller URI, broker host / port / virtualHost,
              # instancePrefix and cert-validation toggles all live on the
              # operator instance (OperatorOptions / OPERATOR__* env vars)
              # and are not duplicated on the CR. The pool's user-facing
              # display name lives on the controller's RtPool.Name attribute
              # (visible in Studio) and is not carried on the CR.
              tenantId:
                nullable: false
                type: string
              poolRtId:
                nullable: false
                type: string
                description: "24-character lowercase hex MongoDB ObjectId of the controller-side RtPool entity. Canonical pool identity."
                pattern: "^[a-f0-9]{24}$"
            required:
              - tenantId
              - poolRtId
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

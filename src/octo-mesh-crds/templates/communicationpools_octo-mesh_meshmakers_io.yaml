apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: communicationpools.octo-mesh.meshmakers.io
spec:
  group: octo-mesh.meshmakers.io
  names:
    kind: CommunicationPool
    listKind: CommunicationPoolList
    plural: communicationpools
    singular: communicationpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          status:
            nullable: false
            properties:
              communicationStatus:
                nullable: false
                type: string
            type: object
          spec:
            nullable: false
            properties:
              # The CR is an intent record: "the operator that watches this
              # namespace should manage pool {poolRtId} for tenant
              # {tenantId}". poolRtId is the runtime entity id (24-char
              # lowercase hex) — it drives the derived k8s identifiers
              # (CR metadata.name, broker secret name) because it is
              # always RFC 1123 valid. poolName is the user-facing
              # display name from the CK entity, preserved here so the
              # spec survives controller-side renames without forcing a
              # CR rebuild.
              #
              # Controller URI, broker host / port / virtualHost,
              # instancePrefix and cert-validation toggles all live on
              # the operator instance (OperatorOptions / OPERATOR__* env
              # vars) and are not duplicated on the CR.
              tenantId:
                nullable: false
                type: string
              poolRtId:
                nullable: false
                type: string
              poolName:
                nullable: false
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}